<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bookmark Manager</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
      50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out forwards;
    }
    
    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    .loading-shimmer {
      background: linear-gradient(90deg, #1e1b4b 25%, #312e81 50%, #1e1b4b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    
    .bookmark-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .bookmark-card:hover {
      transform: translateY(-4px);
    }
    
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .bookmark-card:hover .delete-btn {
      opacity: 1;
    }
    
    .glass-effect {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="h-full m-0 overflow-auto" style="font-family: 'Space Grotesk', sans-serif;">
  <div id="app-wrapper" class="min-h-full w-full" style="background: linear-gradient(135deg, #0f0a1e 0%, #1a1333 50%, #0d1f2d 100%);">
    
    <!-- Header -->
    <header class="sticky top-0 z-50 glass-effect border-b" style="background: rgba(15, 10, 30, 0.8); border-color: rgba(99, 102, 241, 0.2);">
      <div class="max-w-4xl mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center animate-pulse-glow" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
              </svg>
            </div>
            <h1 id="app-title" class="text-xl font-bold" style="color: #e0e7ff;">Smart Bookmarks</h1>
          </div>
          <div id="bookmark-count" class="px-3 py-1 rounded-full text-sm font-medium" style="background: rgba(99, 102, 241, 0.2); color: #a5b4fc;">
            0 bookmarks
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6">
      
      <!-- Add Bookmark Form -->
      <div class="mb-8 p-6 rounded-2xl border" style="background: rgba(30, 27, 75, 0.5); border-color: rgba(99, 102, 241, 0.3);">
        <h2 class="text-lg font-semibold mb-4" style="color: #c7d2fe;">Add New Bookmark</h2>
        <form id="bookmark-form" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="url-input" class="block text-sm font-medium mb-2" style="color: #a5b4fc;">URL</label>
              <input 
                type="url" 
                id="url-input" 
                placeholder="https://example.com" 
                required
                class="w-full px-4 py-3 rounded-xl border focus:outline-none focus:ring-2 transition-all"
                style="background: rgba(15, 10, 30, 0.8); border-color: rgba(99, 102, 241, 0.3); color: #e0e7ff; font-family: 'JetBrains Mono', monospace;"
              >
            </div>
            <div>
              <label for="title-input" class="block text-sm font-medium mb-2" style="color: #a5b4fc;">Title</label>
              <input 
                type="text" 
                id="title-input" 
                placeholder="My Bookmark" 
                required
                class="w-full px-4 py-3 rounded-xl border focus:outline-none focus:ring-2 transition-all"
                style="background: rgba(15, 10, 30, 0.8); border-color: rgba(99, 102, 241, 0.3); color: #e0e7ff;"
              >
            </div>
          </div>
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full md:w-auto px-6 py-3 rounded-xl font-semibold transition-all hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
            style="background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;"
          >
            <span id="submit-text" class="flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
              Add Bookmark
            </span>
          </button>
        </form>
      </div>

      <!-- Toast Notification -->
      <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50" style="background: #10b981; color: white;">
        <span id="toast-message">Bookmark added!</span>
      </div>

      <!-- Bookmarks List -->
      <div id="bookmarks-container">
        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16">
          <div class="w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center" style="background: rgba(99, 102, 241, 0.1);">
            <svg class="w-12 h-12" style="color: #6366f1;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </div>
          <h3 class="text-xl font-semibold mb-2" style="color: #c7d2fe;">No bookmarks yet</h3>
          <p id="empty-message" class="text-sm" style="color: #6b7280;">Add your first bookmark to get started!</p>
        </div>

        <!-- Bookmarks Grid -->
        <div id="bookmarks-grid" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
        </div>
      </div>

      <!-- Delete Confirmation Modal -->
      <div id="delete-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background: rgba(0, 0, 0, 0.7);">
        <div class="w-full max-w-md p-6 rounded-2xl border" style="background: #1e1b4b; border-color: rgba(239, 68, 68, 0.3);">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: rgba(239, 68, 68, 0.2);">
              <svg class="w-5 h-5" style="color: #ef4444;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold" style="color: #fecaca;">Delete Bookmark?</h3>
          </div>
          <p class="mb-6 text-sm" style="color: #9ca3af;">This action cannot be undone. The bookmark will be permanently removed.</p>
          <div class="flex gap-3">
            <button id="cancel-delete" class="flex-1 px-4 py-2 rounded-xl font-medium transition-all hover:opacity-80" style="background: rgba(107, 114, 128, 0.3); color: #e5e7eb;">
              Cancel
            </button>
            <button id="confirm-delete" class="flex-1 px-4 py-2 rounded-xl font-medium transition-all hover:opacity-80" style="background: #ef4444; color: white;">
              Delete
            </button>
          </div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t" style="border-color: rgba(99, 102, 241, 0.1);">
      <p class="text-center text-sm" style="color: #4b5563;">Your bookmarks are automatically saved ✨</p>
    </footer>

  </div>

  <script>
    // Storage key
    const STORAGE_KEY = 'smart_bookmarks_data';

    // Default configuration
    const defaultConfig = {
      app_title: 'Smart Bookmarks',
      empty_message: 'Add your first bookmark to get started!',
    };

    // State
    let bookmarks = [];
    let bookmarkToDelete = null;
    let isDeleting = false;

    // DOM Elements
    const form = document.getElementById('bookmark-form');
    const urlInput = document.getElementById('url-input');
    const titleInput = document.getElementById('title-input');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const bookmarksGrid = document.getElementById('bookmarks-grid');
    const emptyState = document.getElementById('empty-state');
    const bookmarkCount = document.getElementById('bookmark-count');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    const deleteModal = document.getElementById('delete-modal');
    const cancelDelete = document.getElementById('cancel-delete');
    const confirmDelete = document.getElementById('confirm-delete');
    const appTitle = document.getElementById('app-title');
    const emptyMessage = document.getElementById('empty-message');

    // Load bookmarks from localStorage
    function loadBookmarks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          bookmarks = JSON.parse(saved);
          renderBookmarks();
        }
      } catch (e) {
        console.error('Error loading bookmarks:', e);
      }
    }

    // Save bookmarks to localStorage
    function saveBookmarks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
      } catch (e) {
        console.error('Error saving bookmarks:', e);
      }
    }

    // Show toast notification
    function showToast(message, isError = false) {
      toastMessage.textContent = message;
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3000);
    }

    // Get favicon URL
    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch {
        return null;
      }
    }

    // Generate unique ID
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // Create bookmark card HTML
    function createBookmarkCard(bookmark, index) {
      const card = document.createElement('div');
      card.className = 'bookmark-card p-4 rounded-xl border relative group animate-fade-in-up';
      card.style.cssText = 'background: rgba(30, 27, 75, 0.6); border-color: rgba(99, 102, 241, 0.2);';
      card.style.animationDelay = `${index * 0.05}s`;
      card.dataset.id = bookmark.id;

      const faviconUrl = bookmark.favicon || getFaviconUrl(bookmark.url);
      const createdDate = new Date(bookmark.createdAt).toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      card.innerHTML = `
        <a href="${escapeHtml(bookmark.url)}" target="_blank" rel="noopener noreferrer" class="flex items-start gap-4 no-underline">
          <div class="w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0 overflow-hidden" style="background: rgba(99, 102, 241, 0.2);">
            ${faviconUrl ? 
              `<img src="${escapeHtml(faviconUrl)}" alt="" class="w-8 h-8 object-contain" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
               <svg class="w-6 h-6 hidden" style="color: #6366f1;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
               </svg>` :
              `<svg class="w-6 h-6" style="color: #6366f1;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
               </svg>`
            }
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-base mb-1 truncate" style="color: #e0e7ff;">${escapeHtml(bookmark.title)}</h3>
            <p class="text-xs truncate mb-2" style="color: #6b7280; font-family: 'JetBrains Mono', monospace;">${escapeHtml(bookmark.url)}</p>
            <p class="text-xs" style="color: #4b5563;">Added ${createdDate}</p>
          </div>
        </a>
        <button 
          class="delete-btn absolute top-3 right-3 w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:scale-110"
          style="background: rgba(239, 68, 68, 0.2);"
          data-delete-id="${bookmark.id}"
          aria-label="Delete bookmark"
        >
          <svg class="w-4 h-4" style="color: #ef4444;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      `;

      // Add delete button event listener
      const deleteBtn = card.querySelector('[data-delete-id]');
      deleteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openDeleteModal(bookmark);
      });

      return card;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Render bookmarks
    function renderBookmarks() {
      const count = bookmarks.length;
      bookmarkCount.textContent = `${count} bookmark${count !== 1 ? 's' : ''}`;

      if (count === 0) {
        emptyState.classList.remove('hidden');
        bookmarksGrid.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      bookmarksGrid.classList.remove('hidden');

      // Sort by created date (newest first)
      const sortedBookmarks = [...bookmarks].sort((a, b) => 
        new Date(b.createdAt) - new Date(a.createdAt)
      );

      // Clear and rebuild grid
      bookmarksGrid.innerHTML = '';
      sortedBookmarks.forEach((bookmark, index) => {
        bookmarksGrid.appendChild(createBookmarkCard(bookmark, index));
      });
    }

    // Open delete modal
    function openDeleteModal(bookmark) {
      bookmarkToDelete = bookmark;
      deleteModal.classList.remove('hidden');
      deleteModal.classList.add('flex');
    }

    // Close delete modal
    function closeDeleteModal() {
      bookmarkToDelete = null;
      deleteModal.classList.add('hidden');
      deleteModal.classList.remove('flex');
      confirmDelete.disabled = false;
      confirmDelete.textContent = 'Delete';
    }

    // Handle form submission
    async function handleSubmit(e) {
      e.preventDefault();

      const url = urlInput.value.trim();
      const title = titleInput.value.trim();

      if (!url || !title) return;

      // Show loading state
      submitBtn.disabled = true;
      submitText.innerHTML = `
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Adding...
      `;

      // Simulate loading delay for UX
      await new Promise(resolve => setTimeout(resolve, 500));

      const newBookmark = {
        id: generateId(),
        url: url,
        title: title,
        favicon: getFaviconUrl(url),
        createdAt: new Date().toISOString()
      };

      bookmarks.push(newBookmark);
      saveBookmarks();
      renderBookmarks();

      showToast('✅ Bookmark saved!');
      urlInput.value = '';
      titleInput.value = '';
      urlInput.focus();

      // Reset button state
      submitBtn.disabled = false;
      submitText.innerHTML = `
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add Bookmark
      `;
    }

    // Handle delete confirmation
    async function handleDelete() {
      if (!bookmarkToDelete || isDeleting) return;

      isDeleting = true;
      confirmDelete.disabled = true;
      confirmDelete.textContent = 'Deleting...';

      // Simulate deletion delay
      await new Promise(resolve => setTimeout(resolve, 300));

      bookmarks = bookmarks.filter(b => b.id !== bookmarkToDelete.id);
      saveBookmarks();
      renderBookmarks();

      showToast('🗑️ Bookmark deleted');

      isDeleting = false;
      closeDeleteModal();
    }

    // Event listeners
    form.addEventListener('submit', handleSubmit);
    cancelDelete.addEventListener('click', closeDeleteModal);
    confirmDelete.addEventListener('click', handleDelete);
    deleteModal.addEventListener('click', (e) => {
      if (e.target === deleteModal) closeDeleteModal();
    });

    // Initialize on page load
    loadBookmarks();
  </script>
